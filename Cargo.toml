[package]
name = "aws_iot_node"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "mock-telemetry"
path = "src/mock_telemetry_publisher.rs"

[[bin]]
name = "mqtt-telemetry"
path = "src/mqtt_telemetry_publisher.rs"

[dependencies]
rclrs = "*"
ros-env = "*"
serde_json = "1.0"
rand = "*"
thiserror = "1.0.0"
rumqttc = "0.25.1"
anyhow = "1.0.75"

[dependencies.serde]
version = "*"
features = ["derive"]
